<pre id="rep" style="font:12px monospace"></pre>
<script>
var REP = document.getElementById('rep'); function L(s){ REP.textContent += s + '\n'; }
window.onerror = function(m, s, l, c){ L('JS ERROR: ' + m + ' @' + (s||'').split('/').pop() + ':' + l); };
function go(h){ location.hash = h; window.dispatchEvent(new Event('hashchange')); }
function typeCmd(c){ var i = document.querySelector('.term-line input'); i.value = c; i.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', bubbles:true})); }
var fails = 0; function T(n, ok){ if(!ok){ fails++; L('FAIL ' + n); } else L('ok   ' + n); }
try {
  ['#/', '#/mindset', '#/cheatsheet', '#/resources', '#/own', '#/practice', '#/nope'].forEach(function(h){
    go(h); T('route ' + h + ' renders', document.getElementById('view').innerText.length > 10);
  });
  // lessons
  LESSONS.forEach(function(l){
    go('#/lesson/' + l.id);
    var v = document.getElementById('view');
    T('lesson ' + l.id + ' h1+quiz', v.querySelector('h1') && v.querySelectorAll('.qitem').length === l.quiz.length);
    l.quiz.forEach(function(q, qi){ var r = v.querySelector('input[name=q'+qi+'][value="'+q.a+'"]'); r.checked = true; });
    document.getElementById('gradeBtn').click();
    T('lesson ' + l.id + ' quiz all-correct', progressScore(l) === l.quiz.length);
    var mt = v.querySelectorAll('.mini-term');
    if (mt.length) { typeCmd('pwd'); T('lesson ' + l.id + ' mini-terminal responds', v.querySelector('.term-body').innerText.indexOf('/home/hocvien') >= 0); }
  });
  function progressScore(l){ return JSON.parse(localStorage.getItem('lh_progress')).quiz[l.id]; }
  T('all lessons auto-marked done', LESSONS.every(function(l){ return JSON.parse(localStorage.getItem('lh_progress')).lessons[l.id]; }));
  // challenges
  var sol = {
    'dieu-huong': ['pwd','ls','cd Documents','cat baocao.txt'],
    'tao-file': ['mkdir linux-lab','cd linux-lab','echo hello > nhatky.txt','cp nhatky.txt backup.txt','mv nhatky.txt nhatky-cu.txt'],
    'don-dep': ['rmdir rac','rm -r rac'],
    'phan-quyen': ['ls -l','chmod u+x script.sh','chmod 600 bimat.txt'],
    'loc-log': ['grep ERROR log.txt > loi.txt','grep ERROR log.txt | wc -l > dem.txt']
  };
  CHALLENGES.forEach(function(c){
    go('#/practice/' + c.id);
    var before = document.querySelectorAll('#tasks li.ok').length;
    T('challenge ' + c.id + ' starts incomplete', before < c.tasks.length);
    sol[c.id].forEach(typeCmd);
    var ok = document.querySelectorAll('#tasks li.ok').length;
    T('challenge ' + c.id + ' solved (' + ok + '/' + c.tasks.length + ')', ok === c.tasks.length && document.querySelector('#result .success'));
    document.getElementById('hintBtn').click(); T('challenge ' + c.id + ' hint shows', document.querySelectorAll('.hint-box').length >= 1);
  });
  go('#/practice/loc-log'); typeCmd('echo wrong > dem.txt'); T('wrong answer not accepted', !document.querySelector('#result .success'));
  // cheatsheet search
  go('#/cheatsheet'); var q = document.getElementById('q'); q.value = 'grep'; q.dispatchEvent(new Event('input'));
  T('cheatsheet search grep', document.querySelectorAll('#list .cmd-card').length >= 1);
  // ===== trang mới =====
  go('#/videos'); T('videos page cards = ' + VIDEOS.length, document.querySelectorAll('#view .vid').length === VIDEOS.length);
  T('videos have thumbnail + link', Array.prototype.every.call(document.querySelectorAll('#view .vid'), function(a){ return /youtube\.com\/watch\?v=[\w-]{11}/.test(a.href) && a.querySelector('img'); }));
  READING.forEach(function(r){
    go('#/reading/' + r.id);
    T('reading ' + r.id + ' hidden steps first', document.getElementById('rvBox').hidden === true);
    document.getElementById('rvBtn').click(); T('reading ' + r.id + ' steps shown', !document.getElementById('rvBox').hidden && document.querySelectorAll('#rvBox tr').length === r.steps.length + 1);
    document.querySelector('input[name=rq][value="' + r.q.a + '"]').checked = true; document.getElementById('rqBtn').click();
    T('reading ' + r.id + ' correct', JSON.parse(localStorage.getItem('lh_progress')).reading[r.id] === true);
  });
  go('#/reading/chao'); document.querySelector('input[name=rq][value="0"]').checked = true; document.getElementById('rqBtn').click(); T('reading wrong answer flagged', document.getElementById('rq').classList.contains('wrong'));
  go('#/problems'); T('problems page ' + PLAYBOOK.length + ' items', document.querySelectorAll('#view details').length === PLAYBOOK.length);
  go('#/final'); document.querySelectorAll('#fl li').forEach(function(li){ li.click(); });
  T('final checklist all ticked', /Chúc mừng/.test(document.getElementById('fm').innerText));
  go('#/publish'); var pv = document.getElementById('view').innerText;
  T('publish page has GitHub + billing sections', /GitHub Pages/.test(pv) && /Set up billing/.test(pv) && /API key/.test(pv));
  T('publish page shows video cards', document.querySelectorAll('#view .vid').length >= 4);
  go('#/lesson/shell-script'); T('lesson shows video box', document.querySelectorAll('#view .vid').length >= 2);
  T('every video id used is 11 chars', VIDEOS.every(function(v){ return /^[\w-]{11}$/.test(v.id); }));
  T('every external link has rel noopener', Array.prototype.every.call(document.querySelectorAll('a[target=_blank]'), function(a){ return /noopener/.test(a.rel); }));
  // AI panel
  document.getElementById('aiFab').click(); T('AI panel opens', !document.getElementById('aiPanel').hidden && document.querySelectorAll('.msg').length >= 1);
  T('AI no-key prompt shown', document.getElementById('aiSet') && !document.getElementById('aiSet').hidden);
  // theme
  document.getElementById('themeBtn').click(); T('theme toggles', !!document.documentElement.getAttribute('data-theme'));
  // copy buttons
  go('#/lesson/gioi-thieu'); T('copy buttons added', document.querySelectorAll('pre .copy-btn').length > 0);
  T('progress=100%', /100%/.test(document.getElementById('sidebar').innerText));
} catch (e) { L('EXCEPTION ' + e.stack); fails++; }
L(fails ? fails + ' FAILED' : 'ALL PASSED');
</script>
